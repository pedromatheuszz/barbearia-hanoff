<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>

  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f0e0c">
  <script type="module" src="/theme-init.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">

<body class="page-simple">

      <a href="/" class="brand" aria-label="Barbearia Hanoff, voltar ao site">
